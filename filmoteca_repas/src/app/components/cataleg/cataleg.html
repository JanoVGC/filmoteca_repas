<p class="resum">
  Total: {{ total }} pel·lícules |
  Disponibles: {{ totalDisponibles }} |
  Durada total: {{ DuradaTotal }} |
  Valoració mitjana: {{ valoracioMitjana }}
</p>

<input
  #cercador
  type="text"
  class="cercador"
  placeholder="Cerca per títol..."
  [value]="cerca"
  (input)="onCerca(cercador.value)"
/>

<select #ordenar (change)="onOrdre(ordenar.value)">
  <option value="titol">Ordenar per títol</option>
  <option value="any">Ordenar per any</option>
  <option value="valoracio">Ordenar per valoració</option>
  <option value="durada">Ordenar per durada</option>
</select>

<div class="fitxes">
  @for (p of peliculesFiltrades; track p.id; let i = $index) {
    <app-fitxa-pelicula
      [pelicula]="p"
      [ordre]="i + 1"
      (llogar)="llogar($event)"
      (retornar)="retornar($event)"
    />
  } @empty {
    <p class="buit">No s'ha trobat cap pel·lícula amb aquest títol.</p>
  }
</div>
