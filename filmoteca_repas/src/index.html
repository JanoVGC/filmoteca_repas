<!-- Document HTML principal carregat pel navegador. -->
<!doctype html>
<!-- Indica que el llenguatge principal del document és anglès. -->
<html lang="en">
<head>
  <!-- Defineix la codificació de caràcters del document. -->
  <meta charset="utf-8">
  <!-- Defineix el titol que es mostra a la pestanya del navegador. -->
  <title>FilmotecaRepas</title>
  <!-- Defineix la ruta base usada pels recursos i les rutes. -->
  <base href="/">
  <!-- Fa que la pàgina s'adapti a la mida i escala del dispositiu. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Enllaça la icona que apareix al navegador. -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <!-- Etiqueta principal on Angular mostra el component App. -->
  <app-root></app-root>
</body>
</html>
